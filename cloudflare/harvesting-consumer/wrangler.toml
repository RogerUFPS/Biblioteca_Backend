name = "ufps-harvesting-consumer"
main = "src/index.js"
compatibility_date = "2026-10-19"
workers_dev = true

[vars]
BACKEND_BASE_URL = "https://repositorio-biblioteca-backend.onrender.com"

[[queues.producers]]
binding = "HARVEST_QUEUE"
queue = "ufps-harvesting"

[[queues.consumers]]
queue = "ufps-harvesting"
max_batch_size = 1
max_batch_timeout = 1
max_retries = 5
dead_letter_queue = "ufps-harvesting-dead-letter"
